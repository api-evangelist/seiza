aid: seiza
name: Seiza
description: 'Seiza was a French social-recruitment advertising and recruitment-automation SaaS
  platform dedicated to frontline hiring — hospitality and restaurants, transport and logistics,
  agri-food, industry, retail, temp staffing, healthcare and construction. Founded in Paris in
  2010 as Work4 Labs by Stephane Le Viet, Gautier Machelon and Matt Brown, it built its early
  business on sourcing candidates through non-professional social networks rather than job boards
  or LinkedIn, later rebranding from Work4 to Seiza. It raised roughly $22.8M in venture capital
  (Serena, among others) and served about 400 clients across Europe and the US, including
  McDonald''s, Sysco, Ecolab and Veolia. The product was a recruiter web application — social
  sourcing campaigns, profile enrichment, one-click calling, a compatibility index, automated
  interview scheduling, SMS/messaging and reporting — plus a fixed catalog of 23 named ATS
  connectors (Bullhorn, Workday, Greenhouse, SmartRecruiters, iCIMS, Cornerstone, Recruitee,
  Talensoft, DigitalRecruiters, Beetween, Fountain, Paychex, CareerBuilder, Avionte, Acquity,
  Idibu, PivotCX, Talemetry, Gestmax, Scoptalent, Eolia Software, MyCVtheque, Hubspot), with
  anything outside that list handled as a bespoke integration through sales. No public API,
  developer portal, API reference, OpenAPI/AsyncAPI specification, webhook catalog, SDK or CLI
  was ever published: a 557-URL census of the archived seiza.co site shows only marketing, blog,
  FAQ and legal pages, and every /.well-known/ path returned 404 while the site was live. Seiza
  was acquired by UK job-search engine Adzuna on 2024-11-18 and folded into Adzuna''s social
  recruitment advertising line; Adzuna''s own developer program is profiled separately in this
  network. The company domain seiza.co was still serving in May 2026 but no longer resolves at
  all as of 2026-08-17. This profile is retained as a historical company record; there is no API
  surface to enrich.'
