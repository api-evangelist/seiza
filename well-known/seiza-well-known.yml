name: Seiza well-known probe
summary: >-
  No /.well-known/ document is served by Seiza on any host. The company domain seiza.co no
  longer resolves (SERVFAIL — the GoDaddy delegation answers REFUSED for the zone), so every
  probe fails at DNS before any HTTP request is made. While the site was live, the Internet
  Archive recorded 404s for /.well-known/security.txt, /.well-known/openid-configuration and
  /.well-known/ai-plugin.json on www.seiza.co, so this is a standing absence rather than a
  consequence of the shutdown. NO WellKnown or SecurityTxt pointer is emitted in apis.yml:
  nothing here is a served document.
